<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Priti - Cute Teddy Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating background elements */
        .bg-cute {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.3;
            animation: floatCute 8s infinite linear;
            pointer-events: none;
        }

        @keyframes floatCute {
            0% { transform: translateY(105vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Main Big Card */
        .cute-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            border: 4px solid #ff758c;
            padding: 60px 50px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(255, 117, 140, 0.4);
            max-width: 650px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: popIn 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Cute Corner Teddies */
        .teddy-corner {
            position: absolute;
            font-size: 4rem;
            animation: bounceTeddy 2s infinite alternate ease-in-out;
        }

        .teddy-tl { top: -35px; left: -30px; transform: rotate(-15deg); }
        .teddy-tr { top: -35px; right: -30px; transform: rotate(15deg); }

        @keyframes bounceTeddy {
            0% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            100% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
        }

        h1 {
            font-size: 3.8rem;
            color: #ff477e;
            font-family: 'Dancing Script', cursive, sans-serif;
            margin-bottom: 25px;
            text-shadow: 2px 2px 10px rgba(255, 71, 126, 0.3);
        }

        .poetry-box {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        p {
            font-size: 1.8rem;
            line-height: 1.6;
            color: #5d4037;
            font-weight: 500;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInText 0.6s forwards;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        @keyframes fadeInText {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Next Interactive Button */
        .next-btn {
            background: linear-gradient(135deg, #ff477e, #ff758c);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .next-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #e0366c, #ff477e);
        }

        .next-btn:active {
            transform: scale(0.95);
        }

        /* Heart particle effects */
        .heart {
            position: absolute;
            color: #ff477e;
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: riseHeart 4s linear infinite;
        }

        @keyframes riseHeart {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-400px) scale(1.4); opacity: 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background floating items -->
    <div class="bg-cute" style="left: 10%; animation-delay: 0s;">🧸</div>
    <div class="bg-cute" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="bg-cute" style="left: 60%; animation-delay: 4s;">🧸</div>
    <div class="bg-cute" style="left: 85%; animation-delay: 1s;">✨</div>

    <div class="cute-card">
        <div class="teddy-corner teddy-tl" style="--rot: -15deg;">🧸</div>
        <div class="teddy-corner teddy-tr" style="--rot: 15deg;">🧸</div>

        <h1>HI PRITI</h1>
        
        <div class="poetry-box">
            <p id="poem-line">Like stars that quietly adorn the night,</p>
        </div>

        <button class="next-btn" onclick="nextPoemLine()">Next Line ➔</button>
    </div>

    <script>
        const lines = [
            "Like stars that quietly adorn the night,",
            "Your presence makes the world feel warm and bright.",
            "In every smile, a gentle grace is found,",
            "Where joy and quiet wonder all around.",
            "May every dream you hold take graceful flight,",
            "And lead your steps toward unending light."
        ];

        let index = 0;
        const lineElement = document.getElementById("poem-line");

        function nextPoemLine() {
            index = (index + 1) % lines.length;
            
            // Restart animation trick
            lineElement.style.animation = 'none';
            lineElement.offsetHeight; // trigger reflow
            lineElement.textContent = lines[index];
            lineElement.style.animation = 'fadeInText 0.6s forwards';
        }

        // Floating Hearts generator around the card
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = (window.innerHeight - 50) + 'px';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        setInterval(createHeart, 500);
    </script>
</body>
</html>
